<!doctype html>
<meta name="robots" content="noindex, nofollow">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Elena's Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=swap">
<style>:root {
  --wall:#265E32;
  --w:255 255 255;
  --on:#FFFFFF;
  --pink:#E58AA8;
  --pink-rgb:229 138 168;
  --paper:#FFFFFF;
  --ink:#1B1B1F;
  --ink-2:#62626B;
  --ink-3:#A3A3AB;
  --rule:#E8E8ED;
  --wash:#F4F4F6;
  --blank:#A6AFC1;
  --rasp:#A12E5A;
  --cobalt:#2F55C8;
  --moss:#2F6B4F;
  --marigold:#F2B632;
  --tomato:#DE5237;
  --lilac:#7461C9;
  --marker:#FFE37E;
  --night:#0C0E13;
  --night-ink:#F7F2F4;
  --night-ink-2:#A1A1A6;
  --night-pink:#E2588F;
  --glow-a:162 40 88;
  --glow-b:110 26 60;
  --logo-ink:#FFFFFF;
  --logo-dot:#E58AA8;
  --logo-w:1.7;
  --vj:24 26 22;
  --vj-cream:#F6F1E6;
  --vj-cream-rgb:246 241 230;
  --sage:#8FA886;
  --sage-rgb:143 168 134;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --gut:clamp(16px,3.2vw,56px);
  --out:cubic-bezier(.23,1,.32,1);
  --inout:cubic-bezier(.77,0,.175,1);
  color-scheme: dark;
}
body[data-wall=bookae] {
  --wall:#265E32;
}
body[data-wall=rasp] {
  --wall:#5D2239;
}
body[data-wall=moss] {
  --wall:#2F5041;
}
body[data-wall=lilac] {
  --wall:#342C59;
}
body[data-wall=tomato] {
  --wall:#5D2622;
}
body[data-wall=night] {
  --wall:#0F1219;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--wall);
  color: var(--on);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .9s ease;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .9s ease;
  background:
    radial-gradient(
      110% 85% at 50% 46%,
      #171B29,
      #0C0E13 72%);
}
body[data-wall=night]::before {
  opacity: 1;
}
body[data-mode=land] {
  background: var(--night);
}
body[data-mode=land]::before {
  opacity: 0;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 3px;
}
.sheetlike :focus-visible {
  outline-color: var(--wall);
}
.app {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
}
.top {
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 0 clamp(16px, 3vw, 44px);
  min-height: 64px;
}
.mark {
  display: flex;
  align-items: center;
  min-height: 44px;
  line-height: 0;
}
.logo {
  display: block;
  width: 98px;
  height: 26px;
}
.logo path {
  fill: var(--logo-ink);
}
.logo circle {
  fill: var(--logo-dot);
}
.logo .km {
  fill: none;
  stroke: var(--logo-ink);
  stroke-width: var(--logo-w);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.rail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 clamp(12px, 2vw, 28px);
  font-size: 15px;
  font-weight: 500;
}
.rail .ch {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  color: rgb(var(--w)/.72);
  transition: color .2s;
}
.rail i {
  display: none;
}
.rail .done {
  color: rgb(var(--w)/.9);
}
.rail .now {
  color: var(--on);
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 7px;
}
.skip {
  margin-left: auto;
  min-height: 44px;
  padding: 0 2px;
  font-size: 15px;
  font-weight: 500;
  color: rgb(var(--w)/.78);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}
.skip:hover {
  color: var(--on);
}
.skip.off {
  visibility: hidden;
}
body[data-mode=land] :is(.rail, .skip, .guide, .dock) {
  display: none;
}
.guide {
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 6px 12px;
  min-height: 50px;
  padding: 10px 18px;
  border-radius: 14px;
  background: rgb(0 0 0/.24);
  box-shadow: inset 0 0 0 1px rgb(var(--w)/.14);
}
.g-dot {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgb(var(--w)/.36);
}
.guide.yours .g-dot {
  background: var(--pink);
  animation: gp 1.3s ease-out infinite;
}
.g-tag {
  flex: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.72);
}
.g-say {
  min-width: 0;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.3;
  color: rgb(var(--w)/.86);
}
.guide.yours .g-say {
  font-weight: 600;
  color: var(--on);
}
.guide.flash {
  animation: gflash .55s var(--out);
}
.stage {
  grid-row: 3;
  position: relative;
  container-type: size;
  min-height: 0;
  margin-top: 10px;
}
.dock {
  grid-row: 4;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-content: start;
  padding-block: 12px max(16px, env(safe-area-inset-bottom, 0px));
}
.tell {
  min-width: 0;
}
.stamp {
  margin: 0 0 .7em;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.8);
}
.say {
  margin: 0;
  font-size: clamp(23px, 6.1vw, 34px);
  line-height: 1.06;
  font-weight: 600;
  letter-spacing: -.03em;
  text-wrap: balance;
  min-height: 3.18em;
}
.say.big {
  font-size: clamp(27px, 7.4vw, 42px);
  line-height: 1.02;
  min-height: 2.55em;
}
.say.in {
  animation: sayin .36s var(--out) both;
}
.say em {
  font-style: italic;
}
.say .nv {
  font-style: normal;
  text-decoration: underline;
  text-decoration-color: var(--pink);
  text-decoration-thickness: .09em;
  text-underline-offset: .13em;
}
.dock.full .say {
  min-height: 0;
}
.more {
  display: grid;
}
.lede {
  margin: 1.05em 0 0;
  max-width: 34em;
  font-size: 16px;
  line-height: 1.45;
  color: rgb(var(--w)/.88);
}
.how {
  margin: .95em 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .5em;
  max-width: 36em;
  font-size: 15px;
  line-height: 1.4;
  color: rgb(var(--w)/.88);
}
.how li {
  display: flex;
  gap: .7em;
  align-items: baseline;
}
.how i {
  flex: none;
  width: .6em;
  height: .6em;
  border-radius: 50%;
  background: var(--on);
  translate: 0 -.05em;
}
.how li:first-child i {
  background: var(--pink);
}
.vow {
  margin: .6em 0 0;
  font-size: clamp(19px, 5vw, 26px);
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -.015em;
}
.rule {
  position: relative;
  height: 1px;
  margin-block: 14px 12px;
  background: rgb(var(--w)/.3);
}
.timer {
  position: absolute;
  left: 0;
  top: -1px;
  height: 3px;
  width: 0;
  background: var(--on);
}
.act {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  align-items: center;
  min-height: 48px;
}
.ctas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .55em;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  border: 1.5px solid rgb(var(--w)/.78);
  background: transparent;
  color: var(--on);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background .18s,
    color .18s,
    border-color .18s,
    transform .18s;
}
.act .btn {
  animation: sayin .3s var(--out) both;
}
.btn:hover {
  background: var(--on);
  border-color: var(--on);
  color: var(--wall);
}
.btn:active {
  transform: scale(.98);
}
.btn.primary {
  background: var(--on);
  border-color: var(--on);
  color: var(--wall);
}
.btn.primary:hover {
  background: rgb(var(--w)/.86);
  border-color: transparent;
}
.btn.quiet {
  min-height: 44px;
  padding: 0 2px;
  border: 0;
  border-radius: 0;
  color: var(--on);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}
.btn.quiet:hover {
  background: none;
  color: rgb(var(--w)/.78);
}
.btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn.big {
  min-height: 56px;
  padding: 0 28px;
  font-size: 18px;
}
.btn.pulse {
  animation: sayin .3s var(--out) both, bp 1.5s ease-out .4s infinite;
}
.sheetlike .btn.primary {
  background: var(--wall);
  border-color: var(--wall);
  color: var(--on);
}
.sheetlike .btn.primary:hover {
  background: var(--ink);
  border-color: var(--ink);
}
.sheetlike .btn.pulse {
  animation: sayin .3s var(--out) both, bpw 1.5s ease-out .4s infinite;
}
.scene {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(10px, min(3.1cqw, 2.7cqh), 19px);
  transition: opacity .24s ease, transform .24s ease;
}
.scene[data-s=fit] {
  font-size: clamp(10px, min(3.1cqw, 2.5cqh), 19px);
}
.scene[data-s=room] {
  font-size: clamp(10px, min(3.1cqw, 2.55cqh), 19px);
}
.scene[data-s=arr] {
  font-size: clamp(10px, min(3.1cqw, 2.2cqh), 18px);
}
.scene.out {
  opacity: 0;
  transform: translateY(10px);
}
.label {
  margin: 0;
  font-size: max(.74em, 11px);
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.8);
}
.sheetlike {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1.5em 3.2em -1em rgb(0 0 0/.4), 0 .3em .9em -.3em rgb(0 0 0/.22);
}
.sheetlike .label {
  color: var(--ink-2);
}
.c-rasp {
  --c:var(--rasp);
}
.c-cobalt {
  --c:var(--cobalt);
}
.c-moss {
  --c:var(--moss);
}
.c-marigold {
  --c:var(--marigold);
}
.c-tomato {
  --c:var(--tomato);
}
.c-lilac {
  --c:var(--lilac);
}
.c-ink {
  --c:var(--ink);
}
.mk {
  color: var(--ink);
  background: var(--marker);
  box-shadow: 0 .08em 0 .06em var(--marker);
}
.tip {
  display: inline-flex;
  align-items: center;
  gap: .5em;
  padding: .42em .78em;
  border-radius: 999px;
  background: var(--on);
  color: var(--wall);
  font-size: max(.8em, 12.5px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: 0;
  white-space: nowrap;
}
.tip::before {
  content: "";
  flex: none;
  width: .5em;
  height: .5em;
  border-radius: 50%;
  background: var(--pink);
}
.sheetlike .tip {
  background: var(--wall);
  color: var(--on);
}
.pic {
  --pw:15em;
  --rib:max(calc(var(--pw)/50),4px);
  position: relative;
  isolation: isolate;
  display: block;
  flex: none;
  width: var(--pw);
  aspect-ratio: 2/3;
  overflow: hidden;
  text-align: left;
  color: var(--on);
  background: var(--c,var(--rasp));
  box-shadow: 0 1.4em 3em rgb(0 0 0/.32);
}
.pic.hero,
.pile {
  --pw:min(56cqw,calc(72cqh*2/3));
}
.pic::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.22) 0 1px,
      transparent 1px var(--rib));
}
.pic span,
.pic b {
  position: absolute;
  z-index: 1;
}
.pic span {
  font-size: max(calc(var(--pw)*.034), 7px);
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  line-height: 1.55;
}
.pic-tl {
  left: 7.5%;
  top: 6%;
  max-width: 52%;
}
.pic-tr {
  right: 7.5%;
  top: 5.4%;
  text-align: right;
}
.pic-bl {
  left: 7.5%;
  bottom: 5.2%;
}
.pic-mid {
  left: 8%;
  right: 8%;
  top: 50%;
  translate: 0 -50%;
  font-size: calc(var(--pw)*.105);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -.025em;
  text-wrap: balance;
}
.pic-art {
  position: absolute;
  inset: 0;
  z-index: 1;
  filter: drop-shadow(0 calc(var(--rib)*.5) calc(var(--rib)*.7) rgb(0 0 0/.3));
}
.pic-art i {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.97) 0 calc(var(--rib)*.42),
      transparent calc(var(--rib)*.42) var(--rib));
  -webkit-mask: var(--m) 50% 47%/126% auto no-repeat;
  mask: var(--m) 50% 47%/126% auto no-repeat;
}
.pic.c-marigold {
  color: var(--ink);
}
.pic.c-marigold::before {
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(0 0 0/.16) 0 1px,
      transparent 1px var(--rib));
}
.pic.blank {
  --c:#3C7A4A;
}
.pic.printing::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    var(--blank) repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.55) 0 1px,
      transparent 1px var(--rib));
  clip-path: inset(0 0 0 0);
  transition: clip-path 1.5s linear;
}
.pic.printing.go::after {
  clip-path: inset(100% 0 0 0);
}
.printline {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 4;
  height: 2px;
  background: var(--on);
  opacity: 0;
  transition: top 1.5s linear;
}
.pic.printing .printline {
  opacity: 1;
}
.pic.printing.go .printline {
  top: 100%;
}
.pic.under {
  position: absolute;
  inset: 0;
  width: auto;
}
.pic.under.u0 {
  transform: rotate(-3.5deg) translate(0, 3%);
}
.pic.under.u1 {
  transform: rotate(3deg) translate(1.5%, 1.5%);
}
.first {
  display: grid;
  justify-items: center;
}
.land {
  position: absolute;
  inset: 0;
  display: grid;
  align-items: center;
}
.land canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.land .glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse 46% 54% at 22% 50%,
      rgb(var(--glow-a)/.3) 0%,
      rgb(var(--glow-b)/.16) 40%,
      transparent 85%);
}
.land-in {
  position: relative;
  display: grid;
  gap: 26px;
  justify-items: start;
}
.land h1 {
  margin: 0;
  font: 400 clamp(46px, 7.6vw, 112px)/.98 var(--display);
  font-variation-settings: "SOFT" 100;
  letter-spacing: -.02em;
  color: var(--night-ink);
}
.land h1 span {
  display: block;
}
.land h1 b {
  font-weight: 400;
  color: var(--night-pink);
}
.land .sub {
  margin: 0;
  max-width: 30em;
  font-size: clamp(17px, 1.45vw, 21px);
  line-height: 1.5;
  color: var(--night-ink-2);
}
.land-act {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
}
.cta {
  height: 48px;
  padding: 0 24px;
  border-radius: 999px;
  background: var(--night-ink);
  color: var(--night);
  font-size: 17px;
  font-weight: 500;
  line-height: 1;
  transition: transform .18s, opacity .2s;
}
.cta:hover {
  opacity: .88;
}
.cta:active {
  transform: scale(.98);
}
.land-note {
  font-size: 14px;
  color: var(--night-ink-2);
}
.landframe {
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--night);
  opacity: 0;
  transition: opacity .5s ease;
}
.landframe.in {
  opacity: 1;
}
.landpill {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  z-index: 21;
  translate: -50% 12px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-size: clamp(13.5px, 3.6vw, 15px);
  font-weight: 600;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 12px 34px -10px rgb(0 0 0/.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s, translate .4s var(--out);
}
.landpill.in {
  opacity: 1;
  translate: -50% 0;
  pointer-events: auto;
}
.landpill .g-dot {
  background: var(--rasp);
  animation: gp 1.3s ease-out infinite;
}
.days {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: .9em;
  justify-items: center;
}
.shelf {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8em;
  min-height: 1.9em;
  width: 100%;
}
.shelf-dots {
  display: flex;
  gap: .32em;
}
.shelf-dots i {
  width: .68em;
  height: 1.02em;
  background: var(--c);
  box-shadow: 0 0 0 1px rgb(var(--w)/.6);
  animation: pop .45s var(--out) both;
}
.shelf-n {
  font-size: max(.8em, 12px);
  color: rgb(var(--w)/.8);
  min-width: 6em;
}
.days-main {
  position: relative;
  width: 100%;
  min-height: 0;
  display: grid;
  place-items: center;
  transition: opacity .22s;
}
.days-main.out {
  opacity: 0;
}
.scene.pin .days-main {
  place-items: start center;
}
.scene.pin .days-main > .composer {
  margin-top: min(5em, 11cqh);
}
.composer {
  width: min(100%, 34em);
  display: grid;
  gap: .45em;
  padding: 1.1em 1.3em .8em;
  transition: transform .5s var(--inout), opacity .4s;
}
.composer.kept {

.c-title {

.c-text {

.c-foot {

.vj-float-pill svg {

.keep {

}

.ypaper header {
  display: flex;
  gap: 1em;
}
.ypaper header .label:last-child {
  margin-left: auto;
}
#ytext {
  display: block;
  width: 100%;
  min-height: 4.3em;
  margin: .35em 0 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  caret-color: var(--rasp);
  font: inherit;
  font-size: max(1.26em, 16px);
  line-height: 1.4;
  letter-spacing: -.008em;
  resize: none;
}
#ytext::placeholder {
  color: var(--ink-3);
}
#ytext:focus,
#ytext:focus-visible {
  outline: none;
}
.ynote {
  margin: 0;
  font-size: max(.78em, 12px);
  line-height: 1.35;
  color: var(--ink-2);
}
.pic .ymid {
  font-size: calc(var(--pw)*var(--ms,.105));
  line-height: 1.1;
  letter-spacing: -.02em;
  overflow-wrap: anywhere;
}
@container (min-width:521px) {
  .scene[data-s=bd],
  .scene[data-s=card],
  .scene[data-s=ut],
  .scene[data-s=you] {
    font-size: clamp(10px, min(3.1cqw, 2.7cqh), 23px);
  }
}
.act:has(.links) {
  display: grid;
  justify-items: start;
  gap: 4px;
}
.ctas.links {
  gap: 0 1.3em;
}
.ctas.links .btn.quiet {
  font-size: 15px;
  font-weight: 500;
  color: rgb(var(--w)/.86);
}
.btn .sm {
  display: none;
}
@media (max-width: 760px) {
  .lede.fin {
    display: none;
  }
  .ctas.two {
    flex-wrap: nowrap;
    gap: 8px;
  }
  .ctas.two .btn {
    min-height: 46px;
    padding: 0 15px;
    font-size: 15px;
  }
  .btn .lg {
    display: none;
  }
  .btn .sm {
    display: inline;
  }
}
@media (max-width: 760px) and (max-height: 700px) {
  .scene[data-s=bd],
  .scene[data-s=card],
  .scene[data-s=ut],
  .scene[data-s=you] {
    overflow: hidden auto;
    align-items: safe center;
    scrollbar-width: none;
  }
}
@keyframes bob {
  from {
    translate: 0 -.22em;
  }
  to {
    translate: 0 .22em;
  }
}
@keyframes arrive {
  from {
    opacity: 0;
    transform: translate(8em, -7em) rotate(16deg) scale(.3);
  }
}
@keyframes leave {
  to {
    opacity: 0;
    transform: translate(8em, -7em) rotate(16deg) scale(.3);
  }
}
@keyframes sweep {
  to {
    background-size: 100% 72%;
  }
}
@keyframes printin {
  from {
    clip-path: inset(0 0 100% 0);
  }
  to {
    clip-path: inset(0 0 0 0);
  }
}
@container (max-width:520px) {
  .bd,
  .bd[data-st=open] {
    --pw:8.3em;
    gap: .8em;
  }
  .bd[data-st=pick] {
    --pw:min(9em,29cqw);
  }
  .bd[data-st=recall],
  .bd[data-st=ask] {
    --pw:7.6em;
  }
  .dayrow {
    gap: 1em;
  }
  .dayp {
    gap: .5em;
  }
  .bd[data-st=open] {
    column-gap: 1em;
  }
  .bd[data-st=recall] .dp-cap,
  .bd[data-st=ask] .dp-cap {
    display: none;
  }
  .join {
    width: 3.2em;
  }
  .tag2 {
    padding: .45em .95em;
  }
  .paper {
    padding: .8em 1em .75em;
    gap: .5em;
  }
  .paper header .label:first-child {
    display: none;
  }
  .echo {
    gap: .6em;
  }
  .echo div {
    grid-template-columns: minmax(0, 1fr);
    gap: .1em;
  }
  .qbtn {
    padding: .7em 1em;
  }
  .kcard {
    gap: .75em;
    padding: 1em 1.15em .9em;
    width: 100%;
  }
  .ut,
  .you {
    width: 100%;
  }
  .ut li {
    padding: .6em 0;
  }
}
</style>
