<!doctype html>
<meta name="robots" content="noindex, nofollow">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Elena's Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Geist:wght@400;500;600&display=swap">
<style>:root {
  --paper:#FFFFFF;
  --on:#FFFFFF;
  --on-rgb:255 255 255;
  --ink:#231C29;
  --ink-2:#655C6B;
  --ink-3:#A29BA8;
  --rule:#E9E4EC;
  --wash:#F5F2F7;
  --plum:#443447;
  --rasp:#A12E5A;
  --pulse:#F08FB4;
  --pulse-rgb:240 143 180;
  --cobalt:#2F55C8;
  --moss:#2F6B4F;
  --marigold:#F2B632;
  --tomato:#DE5237;
  --lilac:#7461C9;
  --marker:#FFE37E;
  --shade:35 28 41;
  --night:#0C0E13;
  --night-ink:#F7F2F4;
  --night-ink-2:#A1A1A6;
  --night-pink:#E2588F;
  --glow-a:162 40 88;
  --glow-b:110 26 60;
  --logo-ink:#15120D;
  --logo-dot:#A12E5A;
  --logo-w:3;
  --vj:24 26 22;
  --vj-cream:#F6F1E6;
  --vj-cream-rgb:246 241 230;
  --sage:#8FA886;
  --sage-rgb:143 168 134;
  --clay:#9A4A2C;
  --clay-soft:#F4E3DA;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --out:cubic-bezier(.23,1,.32,1);
  --inout:cubic-bezier(.77,0,.175,1);
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  font-variation-settings: "SOFT" 100;
  overflow: hidden;
  transition: background-color .7s ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-mode=land] {
  background: var(--night);
  --logo-ink:#FFFFFF;
  --logo-dot:#E58AA8;
  --logo-w:1.7;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--cobalt);
  outline-offset: 3px;
}
.app {
  height: 100%;
  max-width: 1240px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
}
.top {
  grid-row: 1;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding-block: 14px 8px;
}
.mark {
  justify-self: start;
  display: block;
  line-height: 0;
}
.logo {
  display: block;
  width: 113px;
  height: 30px;
}
.logo path {
  fill: var(--logo-ink);
}
.logo circle {
  fill: var(--logo-dot);
}
.logo .km {
  fill: none;
  stroke: var(--logo-ink);
  stroke-width: var(--logo-w);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.rail {
  display: flex;
  gap: 4px;
}
.rail button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 6px;
  font-size: 13px;
  color: var(--ink-3);
  transition: color .2s;
}
.rail button:hover {
  color: var(--ink);
}
.rail i {
  display: block;
  width: 22px;
  height: 3px;
  background: var(--rule);
  transition: background .3s;
}
.rail .done i {
  background: var(--ink);
}
.rail .now {
  color: var(--ink);
}
.rail .now i {
  background: var(--rasp);
}
.skip {
  justify-self: end;
  font-size: 13px;
  color: var(--ink-2);
  padding: 10px 2px;
}
.skip:hover {
  color: var(--ink);
}
.skip.off {
  visibility: hidden;
}
body[data-mode=land] :is(.rail, .skip, .guide, .dock) {
  display: none;
}
.guide {
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 6px 12px;
  min-height: 50px;
  padding: 10px 16px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--on);
}
.g-dot {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgb(var(--on-rgb)/.34);
}
.guide.yours .g-dot {
  background: var(--pulse);
  animation: gp 1.3s ease-out infinite;
}
.g-tag {
  flex: none;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgb(var(--on-rgb)/.62);
}
.g-say {
  min-width: 0;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.3;
  color: rgb(var(--on-rgb)/.8);
}
.guide.yours .g-say {
  font-weight: 500;
  color: var(--on);
}
.guide.flash {
  animation: gflash .55s var(--out);
}
.stage {
  grid-row: 3;
  position: relative;
  container-type: size;
  min-height: 0;
  margin-top: 8px;
}
.dock {
  grid-row: 4;
  position: relative;
  border-top: 1px solid var(--rule);
  padding-block: 16px 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px 28px;
  align-items: end;
  min-height: 150px;
}
.timer {
  position: absolute;
  left: 0;
  top: -1px;
  height: 2px;
  width: 0;
  background: var(--rasp);
}
.stamp {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--rasp);
}
.say {
  margin: 0;
  font: 400 clamp(21px, 2.5vw, 31px)/1.18 var(--display);
  letter-spacing: -.022em;
  text-wrap: balance;
  max-width: 27em;
  min-height: 2.36em;
}
.say.in {
  animation: sayin .36s var(--out) both;
}
.say em {
  font-style: italic;
}
.act {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
  max-width: 25em;
  min-height: 44px;
}
.btn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 7px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background .18s,
    color .18s,
    transform .18s;
}
.act .btn {
  animation: sayin .3s var(--out) both;
}
.btn:hover {
  background: var(--ink);
  color: var(--paper);
}
.btn:active {
  transform: scale(.98);
}
.btn.primary {
  background: var(--plum);
  border-color: var(--plum);
  color: var(--on);
}
.btn.primary:hover {
  background: var(--ink);
  border-color: var(--ink);
}
.btn.quiet {
  border-color: transparent;
  color: var(--ink-2);
}
.btn.quiet:hover {
  background: var(--wash);
  color: var(--ink);
}
.btn.big {
  min-height: 52px;
  padding: 0 24px;
  font-size: 17px;
}
.btn.pulse {
  animation: sayin .3s var(--out) both, bp 1.5s ease-out .4s infinite;
}
.scene {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(10px, min(1.5cqw, 2.6cqh), 20px);
  transition: opacity .24s ease, transform .24s ease;
}
.scene[data-s=welcome] {
  font-size: clamp(10px, min(1.9cqw, 3.4cqh), 20px);
}
.scene[data-s=days] {
  font-size: clamp(10px, min(2cqw, 3.5cqh), 20px);
}
.scene[data-s=dots] {
  font-size: clamp(10px, min(1.5cqw, 3cqh), 20px);
}
.scene[data-s=fit] {
  font-size: clamp(10px, min(1.5cqw, 2.9cqh), 20px);
}
.scene[data-s=room] {
  font-size: clamp(10px, min(1.6cqw, 2.85cqh), 20px);
}
.scene[data-s=end] {
  font-size: clamp(10px, min(1.6cqw, 3.2cqh), 20px);
}
.scene.out {
  opacity: 0;
  transform: translateY(10px);
}
.label {
  margin: 0;
  font-size: max(.78em, 11.5px);
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.sheetlike {
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 1.6em 3em -1.8em rgb(var(--shade)/.34), 0 .2em .6em -.3em rgb(var(--shade)/.12);
}
.poster {
  --c:var(--rasp);
  width: 10em;
  aspect-ratio: 3/4;
  padding: .85em;
  display: flex;
  flex-direction: column;
  gap: .4em;
  text-align: left;
  color: var(--on);
  background: var(--c);
  box-shadow: 0 1.2em 2em -1.2em rgb(var(--shade)/.5);
}
.poster .p-date {
  font: 500 max(.64em, 9px)/1 var(--ui);
  letter-spacing: .09em;
  text-transform: uppercase;
  opacity: .92;
}
.poster svg {
  width: 70%;
  margin: auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.poster .p-title {
  font: 400 1.06em/1.1 var(--display);
  letter-spacing: -.015em;
}
.c-rasp {
  --c:var(--rasp);
}
.c-cobalt {
  --c:var(--cobalt);
}
.c-moss {
  --c:var(--moss);
}
.c-marigold {
  --c:var(--marigold);
}
.c-tomato {
  --c:var(--tomato);
}
.c-lilac {
  --c:var(--lilac);
}
.c-ink {
  --c:var(--ink);
}
.poster.c-marigold {
  color: var(--ink);
}
.land {
  position: absolute;
  inset: 0;
  display: grid;
  align-items: center;
}
.land canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.land .glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse 46% 54% at 22% 50%,
      rgb(var(--glow-a)/.3) 0%,
      rgb(var(--glow-b)/.16) 40%,
      transparent 85%);
}
.land-in {
  position: relative;
  display: grid;
  gap: 26px;
  justify-items: start;
}
.land h1 {
  margin: 0;
  font: 400 clamp(46px, 7.6vw, 112px)/.98 var(--display);
  letter-spacing: -.02em;
  color: var(--night-ink);
}
.land h1 span {
  display: block;
}
.land h1 b {
  font-weight: 400;
  color: var(--night-pink);
}
.land .sub {
  margin: 0;
  max-width: 30em;
  font-size: clamp(17px, 1.45vw, 21px);
  line-height: 1.5;
  color: var(--night-ink-2);
}
.land-act {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
}
.cta {
  height: 48px;
  padding: 0 24px;
  border-radius: 999px;
  background: var(--night-ink);
  color: var(--night);
  font-size: 17px;
  font-weight: 500;
  line-height: 1;
  transition: transform .18s, opacity .2s;
}
.cta:hover {
  opacity: .88;
}
.cta:active {
  transform: scale(.98);
}
.land-note {
  font-size: 14px;
  color: var(--night-ink-2);
}
.landframe {
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--night);
  opacity: 0;
  transition: opacity .5s ease;
}
.landframe.in {
  opacity: 1;
}
.landpill {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  z-index: 21;
  translate: -50% 12px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 11px 16px;
  border-radius: 7px;
  background: var(--paper);
  color: var(--ink);
  font-size: clamp(13.5px, 3.6vw, 15px);
  font-weight: 500;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 12px 34px -10px rgb(var(--shade)/.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s, translate .4s var(--out);
}
.landpill.in {
  opacity: 1;
  translate: -50% 0;
  pointer-events: auto;
}
.landpill .g-dot {
  background: var(--rasp);
  animation: gp 1.3s ease-out infinite;
}
.welcome {
  width: min(100%, 42em);
  display: grid;
  gap: 1.15em;
  justify-items: start;
}
.welcome h1 {
  margin: 0;
  font: 400 3.7em/1 var(--display);
  letter-spacing: -.035em;
  text-wrap: balance;
}
.welcome .lede {
  margin: 0;
  max-width: 31em;
  font-size: max(1.28em, 16px);
  line-height: 1.45;
  color: var(--ink-2);
}
.how {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .5em;
  font-size: max(1.1em, 15px);
}
.how li {
  display: flex;
  gap: .7em;
  align-items: baseline;
}
.how i {
  flex: none;
  width: 1.2em;
  font-style: normal;
  font-weight: 600;
  color: var(--rasp);
}
.days {
  width: min(100%, 46em);
  display: grid;
  gap: 1.2em;
  justify-items: center;
}
.shelf {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8em;
  min-height: 1.8em;
  width: 100%;
}
.shelf-dots {
  display: flex;
  gap: .35em;
}
.shelf-dots i {
  width: .78em;
  height: .78em;
  border-radius: 50%;
  background: var(--c);
  animation: pop .45s var(--out) both;
}
.shelf-n {
  font-size: max(.8em, 12px);
  color: var(--ink-2);
  min-width: 6em;
}
.days-main {
  position: relative;
  width: 100%;
  height: 22.5em;
  display: grid;
  place-items: center;
  transition: opacity .22s;
}
.days-main.out {
  opacity: 0;
}
.scene.pin,
.scene.pin .days-main {
  place-items: start center;
}
.scene.pin .days {
  padding-top: .4em;
}
.composer {
  width: min(100%, 35em);
  display: grid;
  gap: .45em;
  padding: 1.1em 1.3em .8em;
  transition: transform .5s var(--inout), opacity .4s;
}
.composer.kept {
  transform: scale(.6);
  opacity: 0;
}
.composer header,
.slip header {
  display: flex;
  gap: 1em;
}
.composer header .label:last-child,
.slip header .label:last-child {
  margin-left: auto;
}
.c-title {
  margin: .5em 0 0;
  font: 400 max(1.15em, 15px)/1.3 var(--display);
  color: var(--ink-3);
}
.c-text {
  margin: 0;
  min-height: 4.3em;
  font: 400 max(1.24em, 15px)/1.42 var(--display);
  letter-spacing: -.012em;
}
.tw {
  color: var(--ink-3);
  transition:
    color .25s,
    font-size .35s var(--out),
    opacity .3s,
    background-color .3s;
}
.tw.heard {
  color: var(--ink-2);
}
.c-text.landed .tw {
  color: var(--ink);
}
.c-text.landed .tw.fil {
  color: var(--rasp);
  background: color-mix(in srgb, var(--rasp) 12%, transparent);
  border-radius: .2em;
}
.c-text.landed.clean .tw.fil {
  font-size: 0;
  opacity: 0;
}
.w {
  animation: w .28s ease both;
}
.mk {
  background: var(--marker);
  box-shadow: 0 .08em 0 .06em var(--marker);
}
.c-cue {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4em .9em;
  font-size: max(.8em, 12.5px);
  color: var(--ink-2);
}
.c-cue .tip {
  font-size: 1em;
}
.alt {
  padding: .5em .2em;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.alt:hover {
  color: var(--rasp);
}
.vj-receipt {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 14px;
  padding: 4px 0 2px;
  font-size: 13px;
  color: var(--ink-2);
  animation: w .2s ease-out both;
}
.vj-receipt-mark {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--sage);
  box-shadow: 0 0 0 3px rgb(var(--sage-rgb)/.2);
}
.vj-receipt-text {
  flex: 1 1 auto;
  min-width: 0;
}
.vj-receipt-text b {
  color: var(--ink);
  font-weight: 600;
}
.vj-shimmer {
  background:
    linear-gradient(
      90deg,
      var(--ink-3) 0%,
      var(--ink) 45%,
      var(--ink-3) 90%) 0 0/200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: vjsh 1.6s linear infinite;
}
.vj-seg {
  display: inline-flex;
  padding: 2px;
  border-radius: 6px;
  background: var(--wash);
}
.vj-seg button {
  height: 26px;
  padding: 0 10px;
  border-radius: 4px;
  font-size: 12.5px;
  color: var(--ink-2);
}
.vj-seg button[aria-pressed=true] {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgb(var(--shade)/.18);
}
.c-foot {
  display: flex;
  align-items: center;
  gap: .6em;
  margin-top: .2em;
  padding-top: .6em;
  border-top: 1px solid var(--rule);
  color: var(--ink-2);
}
.c-foot svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.c-words {
  font-size: max(.8em, 12px);
  min-width: 4.6em;
}
.c-icon {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 7px;
  color: var(--ink-2);
}
.c-mic {
  color: var(--ink);
}
.c-mic.ready::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 7px;
  border: 1.5px solid var(--rasp);
  animation: ring 1.6s ease-out infinite;
}
.c-mic.is-live {
  color: var(--clay);
  background: var(--clay-soft);
}
.c-save {
  margin-left: auto;
  min-height: 36px;
  padding: 0 16px;
}
.c-save:disabled {
  opacity: .4;
  pointer-events: none;
}
.vj-float {
  position: absolute;
  left: 50%;
  bottom: 10px;
  z-index: 8;
  display: grid;
  justify-items: center;
  gap: 10px;
  width: min(560px, calc(100% - 4px));
  transform: translate(-50%, 12px);
  opacity: 0;
  transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s ease;
  pointer-events: none;
}
.vj-float.is-open {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}
.vj-float-card {
  max-width: 100%;
  padding: 12px 16px;
  border-radius: 14px;
  background: rgb(var(--vj)/.9);
  color: var(--vj-cream);
  box-shadow: 0 12px 32px -12px rgb(var(--vj)/.45);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.vj-float-text {
  margin: 0;
  max-height: 4.8em;
  overflow-y: auto;
  scrollbar-width: none;
  font-size: 15px;
  line-height: 1.6;
}
.vj-float-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgb(var(--vj)/.94);
