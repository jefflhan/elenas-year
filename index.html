<!doctype html>
<meta name="robots" content="noindex, nofollow">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Elena's Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Hanken+Grotesk:ital,wght@0,400..700;1,400..700&display=swap">
<style>:root {
  --wall:#265E32;
  --w:255 255 255;
  --on:#FFFFFF;
  --pink:#E58AA8;
  --pink-rgb:229 138 168;
  --paper:#FFFFFF;
  --ink:#1B1B1F;
  --ink-2:#62626B;
  --ink-3:#A3A3AB;
  --rule:#E8E8ED;
  --wash:#F4F4F6;
  --blank:#A6AFC1;
  --rasp:#A12E5A;
  --cobalt:#2F55C8;
  --moss:#2F6B4F;
  --marigold:#F2B632;
  --tomato:#DE5237;
  --lilac:#7461C9;
  --marker:#FFE37E;
  --night:#0C0E13;
  --night-ink:#F7F2F4;
  --night-ink-2:#A1A1A6;
  --night-pink:#E2588F;
  --glow-a:162 40 88;
  --glow-b:110 26 60;
  --logo-ink:#FFFFFF;
  --logo-dot:#E58AA8;
  --logo-w:1.7;
  --vj:24 26 22;
  --vj-cream:#F6F1E6;
  --vj-cream-rgb:246 241 230;
  --sage:#8FA886;
  --sage-rgb:143 168 134;
  --sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --gut:clamp(16px,3.2vw,56px);
  --out:cubic-bezier(.23,1,.32,1);
  --inout:cubic-bezier(.77,0,.175,1);
  color-scheme: dark;
}
body[data-wall=bookae] {
  --wall:#265E32;
}
body[data-wall=rasp] {
  --wall:#5D2239;
}
body[data-wall=moss] {
  --wall:#2F5041;
}
body[data-wall=lilac] {
  --wall:#342C59;
}
body[data-wall=tomato] {
  --wall:#5D2622;
}
body[data-wall=night] {
  --wall:#0F1219;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--wall);
  color: var(--on);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .9s ease;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .9s ease;
  background:
    radial-gradient(
      110% 85% at 50% 46%,
      #171B29,
      #0C0E13 72%);
}
body[data-wall=night]::before {
  opacity: 1;
}
body[data-mode=land] {
  background: var(--night);
}
body[data-mode=land]::before {
  opacity: 0;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--on);
  outline-offset: 3px;
}
.sheetlike :focus-visible {
  outline-color: var(--wall);
}
.app {
  position: relative;
  z-index: 1;
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
}
.top {
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 0 clamp(16px, 3vw, 44px);
  min-height: 64px;
}
.mark {
  display: flex;
  align-items: center;
  min-height: 44px;
  line-height: 0;
}
.logo {
  display: block;
  width: 98px;
  height: 26px;
}
.logo path {
  fill: var(--logo-ink);
}
.logo circle {
  fill: var(--logo-dot);
}
.logo .km {
  fill: none;
  stroke: var(--logo-ink);
  stroke-width: var(--logo-w);
  stroke-linecap: round;
  stroke-linejoin: round;
}
.rail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 clamp(12px, 2vw, 28px);
  font-size: 15px;
  font-weight: 500;
}
.rail button {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  color: rgb(var(--w)/.72);
  transition: color .2s;
}
.rail button:hover {
  color: var(--on);
}
.rail i {
  display: none;
}
.rail .done {
  color: rgb(var(--w)/.9);
}
.rail .now {
  color: var(--on);
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 7px;
}
.skip {
  margin-left: auto;
  min-height: 44px;
  padding: 0 2px;
  font-size: 15px;
  font-weight: 500;
  color: rgb(var(--w)/.78);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}
.skip:hover {
  color: var(--on);
}
.skip.off {
  visibility: hidden;
}
body[data-mode=land] :is(.rail, .skip, .guide, .dock) {
  display: none;
}
.guide {
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 6px 12px;
  min-height: 50px;
  padding: 10px 18px;
  border-radius: 14px;
  background: rgb(0 0 0/.24);
  box-shadow: inset 0 0 0 1px rgb(var(--w)/.14);
}
.g-dot {
  flex: none;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgb(var(--w)/.36);
}
.guide.yours .g-dot {
  background: var(--pink);
  animation: gp 1.3s ease-out infinite;
}
.g-tag {
  flex: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.72);
}
.g-say {
  min-width: 0;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.3;
  color: rgb(var(--w)/.86);
}
.guide.yours .g-say {
  font-weight: 600;
  color: var(--on);
}
.guide.flash {
  animation: gflash .55s var(--out);
}
.stage {
  grid-row: 3;
  position: relative;
  container-type: size;
  min-height: 0;
  margin-top: 10px;
}
.dock {
  grid-row: 4;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-content: start;
  padding-block: 12px max(16px, env(safe-area-inset-bottom, 0px));
}
.tell {
  min-width: 0;
}
.stamp {
  margin: 0 0 .7em;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.8);
}
.say {
  margin: 0;
  font-size: clamp(23px, 6.1vw, 34px);
  line-height: 1.06;
  font-weight: 600;
  letter-spacing: -.03em;
  text-wrap: balance;
  min-height: 3.18em;
}
.say.big {
  font-size: clamp(27px, 7.4vw, 42px);
  line-height: 1.02;
  min-height: 2.55em;
}
.say.in {
  animation: sayin .36s var(--out) both;
}
.say em {
  font-style: italic;
}
.say .nv {
  font-style: normal;
  text-decoration: underline;
  text-decoration-color: var(--pink);
  text-decoration-thickness: .09em;
  text-underline-offset: .13em;
}
.dock.full .say {
  min-height: 0;
}
.more {
  display: grid;
}
.lede {
  margin: 1.05em 0 0;
  max-width: 34em;
  font-size: 16px;
  line-height: 1.45;
  color: rgb(var(--w)/.88);
}
.how {
  margin: .95em 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: .5em;
  max-width: 36em;
  font-size: 15px;
  line-height: 1.4;
  color: rgb(var(--w)/.88);
}
.how li {
  display: flex;
  gap: .7em;
  align-items: baseline;
}
.how i {
  flex: none;
  width: .6em;
  height: .6em;
  border-radius: 50%;
  background: var(--on);
  translate: 0 -.05em;
}
.how li:first-child i {
  background: var(--pink);
}
.vow {
  margin: .6em 0 0;
  font-size: clamp(19px, 5vw, 26px);
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -.015em;
}
.rule {
  position: relative;
  height: 1px;
  margin-block: 14px 12px;
  background: rgb(var(--w)/.3);
}
.timer {
  position: absolute;
  left: 0;
  top: -1px;
  height: 3px;
  width: 0;
  background: var(--on);
}
.act {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 12px;
  align-items: center;
  min-height: 48px;
}
.ctas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .55em;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 999px;
  border: 1.5px solid rgb(var(--w)/.78);
  background: transparent;
  color: var(--on);
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background .18s,
    color .18s,
    border-color .18s,
    transform .18s;
}
.act .btn {
  animation: sayin .3s var(--out) both;
}
.btn:hover {
  background: var(--on);
  border-color: var(--on);
  color: var(--wall);
}
.btn:active {
  transform: scale(.98);
}
.btn.primary {
  background: var(--on);
  border-color: var(--on);
  color: var(--wall);
}
.btn.primary:hover {
  background: rgb(var(--w)/.86);
  border-color: transparent;
}
.btn.quiet {
  min-height: 44px;
  padding: 0 2px;
  border: 0;
  border-radius: 0;
  color: var(--on);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}
.btn.quiet:hover {
  background: none;
  color: rgb(var(--w)/.78);
}
.btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn.big {
  min-height: 56px;
  padding: 0 28px;
  font-size: 18px;
}
.btn.pulse {
  animation: sayin .3s var(--out) both, bp 1.5s ease-out .4s infinite;
}
.sheetlike .btn.primary {
  background: var(--wall);
  border-color: var(--wall);
  color: var(--on);
}
.sheetlike .btn.primary:hover {
  background: var(--ink);
  border-color: var(--ink);
}
.sheetlike .btn.pulse {
  animation: sayin .3s var(--out) both, bpw 1.5s ease-out .4s infinite;
}
.scene {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: clamp(10px, min(3.1cqw, 2.7cqh), 19px);
  transition: opacity .24s ease, transform .24s ease;
}
.scene[data-s=fit] {
  font-size: clamp(10px, min(3.1cqw, 2.5cqh), 19px);
}
.scene[data-s=room] {
  font-size: clamp(10px, min(3.1cqw, 2.55cqh), 19px);
}
.scene[data-s=arr] {
  font-size: clamp(10px, min(3.1cqw, 2.2cqh), 18px);
}
.scene.out {
  opacity: 0;
  transform: translateY(10px);
}
.label {
  margin: 0;
  font-size: max(.74em, 11px);
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgb(var(--w)/.8);
}
.sheetlike {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1.5em 3.2em -1em rgb(0 0 0/.4), 0 .3em .9em -.3em rgb(0 0 0/.22);
}
.sheetlike .label {
  color: var(--ink-2);
}
.c-rasp {
  --c:var(--rasp);
}
.c-cobalt {
  --c:var(--cobalt);
}
.c-moss {
  --c:var(--moss);
}
.c-marigold {
  --c:var(--marigold);
}
.c-tomato {
  --c:var(--tomato);
}
.c-lilac {
  --c:var(--lilac);
}
.c-ink {
  --c:var(--ink);
}
.mk {
  color: var(--ink);
  background: var(--marker);
  box-shadow: 0 .08em 0 .06em var(--marker);
}
.tip {
  display: inline-flex;
  align-items: center;
  gap: .5em;
  padding: .42em .78em;
  border-radius: 999px;
  background: var(--on);
  color: var(--wall);
  font-size: max(.8em, 12.5px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: 0;
  white-space: nowrap;
}
.tip::before {
  content: "";
  flex: none;
  width: .5em;
  height: .5em;
  border-radius: 50%;
  background: var(--pink);
}
.sheetlike .tip {
  background: var(--wall);
  color: var(--on);
}
.pic {
  --pw:15em;
  --rib:max(calc(var(--pw)/50),4px);
  position: relative;
  isolation: isolate;
  display: block;
  flex: none;
  width: var(--pw);
  aspect-ratio: 2/3;
  overflow: hidden;
  text-align: left;
  color: var(--on);
  background: var(--c,var(--rasp));
  box-shadow: 0 1.4em 3em rgb(0 0 0/.32);
}
.pic.hero,
.pile {
  --pw:min(56cqw,calc(72cqh*2/3));
}
.pic::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.22) 0 1px,
      transparent 1px var(--rib));
}
.pic span,
.pic b {
  position: absolute;
  z-index: 1;
}
.pic span {
  font-size: max(calc(var(--pw)*.034), 7px);
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  line-height: 1.55;
}
.pic-tl {
  left: 7.5%;
  top: 6%;
  max-width: 52%;
}
.pic-tr {
  right: 7.5%;
  top: 5.4%;
  text-align: right;
}
.pic-bl {
  left: 7.5%;
  bottom: 5.2%;
}
.pic-mid {
  left: 8%;
  right: 8%;
  top: 50%;
  translate: 0 -50%;
  font-size: calc(var(--pw)*.105);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -.025em;
  text-wrap: balance;
}
.pic-art {
  position: absolute;
  inset: 0;
  z-index: 1;
  filter: drop-shadow(0 calc(var(--rib)*.5) calc(var(--rib)*.7) rgb(0 0 0/.3));
}
.pic-art i {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.97) 0 calc(var(--rib)*.42),
      transparent calc(var(--rib)*.42) var(--rib));
  -webkit-mask: var(--m) 50% 47%/126% auto no-repeat;
  mask: var(--m) 50% 47%/126% auto no-repeat;
}
.pic.c-marigold {
  color: var(--ink);
}
.pic.c-marigold::before {
  background:
    repeating-linear-gradient(
      to bottom,
      rgb(0 0 0/.16) 0 1px,
      transparent 1px var(--rib));
}
.pic.blank {
  --c:#3C7A4A;
}
.pic.printing::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  background:
    var(--blank) repeating-linear-gradient(
      to bottom,
      rgb(var(--w)/.55) 0 1px,
      transparent 1px var(--rib));
  clip-path: inset(0 0 0 0);
  transition: clip-path 1.5s linear;
}
.pic.printing.go::after {
  clip-path: inset(100% 0 0 0);
}
.printline {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 4;
  height: 2px;
  background: var(--on);
  opacity: 0;
  transition: top 1.5s linear;
}
.pic.printing .printline {
  opacity: 1;
}
.pic.printing.go .printline {
  top: 100%;
}
.pic.under {
  position: absolute;
  inset: 0;
  width: auto;
}
.pic.under.u0 {
  transform: rotate(-3.5deg) translate(0, 3%);
}
.pic.under.u1 {
  transform: rotate(3deg) translate(1.5%, 1.5%);
}
.first {
  display: grid;
  justify-items: center;
}
.land {
  position: absolute;
  inset: 0;
  display: grid;
  align-items: center;
}
.land canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.land .glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse 46% 54% at 22% 50%,
      rgb(var(--glow-a)/.3) 0%,
      rgb(var(--glow-b)/.16) 40%,
      transparent 85%);
}
.land-in {
  position: relative;
  display: grid;
  gap: 26px;
  justify-items: start;
}
.land h1 {
  margin: 0;
  font: 400 clamp(46px, 7.6vw, 112px)/.98 var(--display);
  font-variation-settings: "SOFT" 100;
  letter-spacing: -.02em;
  color: var(--night-ink);
}
.land h1 span {
  display: block;
}
.land h1 b {
  font-weight: 400;
  color: var(--night-pink);
}
.land .sub {
  margin: 0;
  max-width: 30em;
  font-size: clamp(17px, 1.45vw, 21px);
  line-height: 1.5;
  color: var(--night-ink-2);
}
.land-act {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 18px;
}
.cta {
  height: 48px;
  padding: 0 24px;
  border-radius: 999px;
  background: var(--night-ink);
  color: var(--night);
  font-size: 17px;
  font-weight: 500;
  line-height: 1;
  transition: transform .18s, opacity .2s;
}
.cta:hover {
  opacity: .88;
}
.cta:active {
  transform: scale(.98);
}
.land-note {
  font-size: 14px;
  color: var(--night-ink-2);
}
.landframe {
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--night);
  opacity: 0;
  transition: opacity .5s ease;
}
.landframe.in {
  opacity: 1;
}
.landpill {
  position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom, 0px));
  z-index: 21;
  translate: -50% 12px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-size: clamp(13.5px, 3.6vw, 15px);
  font-weight: 600;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 12px 34px -10px rgb(0 0 0/.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity .4s, translate .4s var(--out);
}
.landpill.in {
  opacity: 1;
  translate: -50% 0;
  pointer-events: auto;
}
.landpill .g-dot {
  background: var(--rasp);
  animation: gp 1.3s ease-out infinite;
}
.days {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: .9em;
  justify-items: center;
}
.shelf {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8em;
  min-height: 1.9em;
  width: 100%;
}
.shelf-dots {
  display: flex;
  gap: .32em;
}
.shelf-dots i {
  width: .68em;
  height: 1.02em;
  background: var(--c);
  box-shadow: 0 0 0 1px rgb(var(--w)/.6);
  animation: pop .45s var(--out) both;
}
.shelf-n {
  font-size: max(.8em, 12px);
  color: rgb(var(--w)/.8);
  min-width: 6em;
}
.days-main {
  position: relative;
  width: 100%;
  min-height: 0;
  display: grid;
  place-items: center;
  transition: opacity .22s;
}
.days-main.out {
  opacity: 0;
}
.scene.pin .days-main {
  place-items: start center;
}
.scene.pin .days-main > .composer {
  margin-top: min(5em, 11cqh);
}
.composer {
  width: min(100%, 34em);
  display: grid;
  gap: .45em;
  padding: 1.1em 1.3em .8em;

.c-title {

}
.c-text {

.tw {

.alt {

.vj-receipt {

}

.c-foot {

.c-foot svg {

.c-words {

.vj-float {

}
.vj-float-text {

}
.vj-float-pill {

}
.vj-float-wave {

  height: 24px;
}

  height: 32px;
  border-radius: 999px;
}
.vj-float-pill svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.vj-float-x {
  background: rgb(var(--vj-cream-rgb)/.12);
  color: rgb(var(--vj-cream-rgb)/.8);
}
.vj-float-x:hover {
  background: rgb(var(--vj-cream-rgb)/.2);

}
.vj-float-ok {

}
.vj-float-ok:disabled {

}

}
.vj-float-pill button:focus-visible {

}
.vj-float-hint {

.keep {

  top: 50%;
  width: min(56cqw, calc(72cqh*2/3));

    opacity .3s,
    transform .6s var(--inout);
}

  scale: 1;
  opacity: 1;
}

  position: absolute;
  inset: 0;
  width: auto;
}
.pile {
  position: relative;
  width: var(--pw);

}

  --pw:inherit;
  position: absolute;

  width: auto;
  transform: rotate(var(--r,0deg));

}
.tbl {
  display: grid;
  justify-items: center;
  gap: .8em;
  width: 100%;
}

  position: relative;
  width: min(100%, 30em);

}

  position: absolute;

  bottom: 1em;

}

}

.sent {

}

  opacity: 1;
}
.card3 {
  position: absolute;
  right: 1.4em;
  top: 50%;
  translate: 0 -50%;

  width: 10.4em;
  padding: .8em .9em;
  font-size: max(.86em, 11.5px);

  transition: opacity .4s;
}

  opacity: 1;
}

  padding-left: 1.25em;

  transition: opacity .4s;
}

  opacity: 1;

.web {
  position: absolute;

}

  gap: .6em;

}
.node.side-t {

  translate: -50% calc(-100% + 1.3em);
}
.node.side-b {

  gap: .35em;
  translate: -50% -1.3em;
}

}

.speck {

.aline .tw.heard {
  color: var(--on);
}
.qact {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .5em .8em;
}
.qact svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.qact .c-mic {
  width: 46px;
  height: 46px;
  background: var(--on);
  color: var(--wall);
}
.qact .c-mic.ready::after {
  border-color: var(--on);
}
.qact .c-mic.is-live {
  background: var(--pink);
  color: var(--ink);
}
.ghost {
  padding: .6em 1.1em;
  border: 1.5px dashed rgb(var(--w)/.55);
  border-radius: 999px;
  font-size: max(.9em, 13px);
  font-weight: 500;
  color: rgb(var(--w)/.86);
  transition: color .2s, border-color .2s;
}
.ghost:hover {
  color: var(--on);
  border-color: var(--on);
}
.ghost.no {
  color: var(--on);
  font-weight: 600;
  border: 1.5px solid var(--pink);
  animation: shake .4s;
}
.arr {
  display: grid;
  gap: .8em;
  width: min(100%, max(34em, 520px));
  justify-items: center;
}
.arr-top {
  display: flex;
  align-items: center;
  gap: .8em;
}
.pieces {
  display: grid;
  gap: .7em;
  width: 100%;
}
.piece {
  display: flex;
  flex-direction: column;
  gap: .4em;
  padding: .95em 1.2em .9em;
  opacity: 0;
  transform: translateY(1em);
  transition: opacity .5s ease, transform .6s var(--out);
}
.piece.in {
  opacity: 1;
  transform: none;
}
.piece h3 {
  margin: 0;
  font-size: 1.3em;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.025em;
}
.piece p {
  margin: 0;
  font-size: max(1em, 13.5px);
  line-height: 1.45;
}
.piece .src {
  margin-top: auto;
  padding-top: .2em;
  font-size: max(.8em, 12px);
  font-weight: 600;
  color: var(--wall);
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: .4em;
}
.pill {
  padding: .25em .7em;
  border: 1px solid #D9D9E0;
  border-radius: 1em;
  font-size: max(.92em, 13px);
  line-height: 1.3;
}
.pill.kept {
  background: var(--marker);
  border-color: var(--marker);
  font-weight: 600;
}
.end {
  display: grid;
  place-items: center;
  width: 100%;
}
.endcard {
  display: grid;
  gap: 1em;
  width: min(100%, 32em);
}
.endcard ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
}
.endcard li {
  padding: .72em 0;
  border-top: 1px solid rgb(var(--w)/.26);
  font-size: max(1em, 14px);
  line-height: 1.4;
  color: rgb(var(--w)/.86);
}
.endcard li b {
  display: block;
  margin-bottom: .1em;
  font-size: 1.24em;
  font-weight: 600;
  letter-spacing: -.015em;
  color: var(--on);
}
.fine {
  margin: 0;
  font-size: max(.84em, 12.5px);
  color: rgb(var(--w)/.76);
}
@keyframes sayin {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
@keyframes w {
  from {
    opacity: 0;
    transform: translateY(.2em);
  }
}
@keyframes pop {
  from {
    opacity: 0;
    scale: .3;
  }
}
@keyframes drop {
  from {
    opacity: 0;
    transform: rotate(var(--r,0deg)) scale(1.12);
  }
}
@keyframes vjsh {
  to {
    background-position: -200% 0;
  }
}
@keyframes okp {
  0% {
    box-shadow: 0 0 0 0 rgb(var(--vj-cream-rgb)/.75);
  }
  100% {
    box-shadow: 0 0 0 10px rgb(var(--vj-cream-rgb)/0);
  }
}
@keyframes ring {
  from {
    transform: scale(1);
    opacity: .7;
  }
  to {
    transform: scale(1.7);
    opacity: 0;
  }
}
@keyframes nudge {
  0% {
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent);
  }
  100% {
    box-shadow: 0 0 0 .95em color-mix(in srgb, var(--c) 0%, transparent);
  }
}
@keyframes pring {
  0% {
    box-shadow: 0 1.4em 3em rgb(0 0 0/.32), 0 0 0 0 rgb(var(--w)/.7);
  }
  100% {
    box-shadow: 0 1.4em 3em rgb(0 0 0/.32), 0 0 0 .8em rgb(var(--w)/0);
  }
}
@keyframes phn {
  50% {
    background-color: color-mix(in srgb, var(--c) 26%, transparent);
  }
}
@keyframes shake {
  25% {
    transform: translateX(-4px);
  }
  75% {
    transform: translateX(4px);
  }
}
@keyframes gp {
  0% {
    box-shadow: 0 0 0 0 rgb(var(--pink-rgb)/.75);
  }
  100% {
    box-shadow: 0 0 0 9px rgb(var(--pink-rgb)/0);
  }
}
@keyframes gflash {
  from {
    background: rgb(var(--w)/.3);
    transform: translateY(-3px);
  }
}
@keyframes bp {
  0% {
    box-shadow: 0 0 0 0 rgb(var(--w)/.55);
  }
  100% {
    box-shadow: 0 0 0 12px rgb(var(--w)/0);
  }
}
@keyframes bpw {
  0% {
    box-shadow: 0 0 0 0 rgb(0 0 0/.3);
  }
  100% {
    box-shadow: 0 0 0 11px rgb(0 0 0/0);
  }
}

@media (min-aspect-ratio: 5/4) and (min-width: 700px) {

      <footer><span class="label" id="pcount">Nothing on the page yet</span><span class="label vowline">Bookae never writes for you</span></footer>
    </article>
    <div class="coachcol">
      <div class="pin" id="pin"><p class="label">Your days</p><div class="picks" id="picks">${posterHTML("laptop", "", "button")}</div><span class="tip">${TAP} the July 13 day</span></div>
      <div class="qcard" id="qcard" hidden>
        <p class="label" id="qn"></p>
        <p class="q" id="qtext"></p>
        <p class="aline" id="aline"></p>
        <div class="qact"><button type="button" class="c-icon c-mic" id="rmic" aria-label="Answer out loud">${IC.mic}</button><span class="tip" id="rtip"></span><button type="button" class="alt" id="ralt">Play her answer</button></div>
      </div>
      <button type="button" class="ghost" id="ghost">Write it for me</button>
    </div></div>`, "room");
    $("#ghost").addEventListener("click", (e) => {
      const g = e.currentTarget;
      g.textContent = "Bookae NEVER writes for you. It asks.";
      g.classList.remove("no");
      void g.offsetWidth;
      g.classList.add("no");
    });
    setSay("UT Austin says any topic. The page is empty.");
    guide(`${TAP} the July 13 day. Bookae starts from what Elena already said.`);
    await new Promise((r) => $("#picks").addEventListener("click", (e) => {
      if (e.target.closest(".poster")) r();
    })).then(c.ok);
    const m = M.laptop;
    $("#pin").innerHTML = narrow() ? `<p class="label">${m.d} · ${m.t} · what you said then</p>` : `<blockquote class="said c-${m.c}"><span class="label">${m.d} · what you said then</span>“${m.q}”</blockquote>`;
    watch("Bookae starts from a day she already told it about.");
    await say(c, "You said this in July. It’s the day you keep coming back to.", 2600);
    watch("That’s Bookae’s rule. Watch what it does instead.");
    await say(c, 'Bookae <em class="nv">never</em> writes for you. It asks.', 3200);
    const pbody = $("#pbody"), qcard = $("#qcard"), aline = $("#aline"), rmic = $("#rmic"), ralt = $("#ralt"), rtip = $("#rtip");
    qcard.hidden = false;
    let para = null, words = 0;
    const lines = [];
    S.para = null;
    for (let i = 0; i < ANSWERS.length; i++) {
      const A = ANSWERS[i], toks = A.a.replace(/\[\[|\]\]/g, "").split(" ").map((t, k, all) => ({ t, sp: k < all.length - 1 }));
      $("#qn").textContent = `Bookae asks · ${i + 1} of ${ANSWERS.length}`;
      $("#qtext").textContent = A.q;
      for (; ; ) {
        aline.innerHTML = toks.map((w) => `<span class="tw">${w.t}</span>`).join(" ");
        rmic.classList.add("ready");
        rmic.classList.remove("is-live");
        rtip.hidden = false;
        ralt.hidden = false;
        rtip.textContent = `${TAP} the mic, then say the grey line`;
        guide(`${TAP} the mic and answer as Elena, out loud.`);
        let micP = null;
        const how = await new Promise((r) => {
          rmic.onclick = () => {
            micP = S.voice === "sim" ? null : openMic();
            r("mic");
          };
          ralt.onclick = () => r("play");
        });
        c.ok();
        rmic.onclick = ralt.onclick = null;
        rmic.classList.remove("ready");
        rmic.classList.add("is-live");
        rtip.hidden = true;
        ralt.hidden = true;
        const res = await runTake(c, toks, $$(".tw", aline), how === "mic" ? micP : null, {
          real: () => guide("Say the grey line out loud. The voice bar shows what Bookae hears."),
          sim: () => watch("This is a simulation of Elena answering, at talking pace.")
        });
        rmic.classList.remove("is-live");
        if (res === "done") break;
      }
      $(".blank", pbody)?.remove();
      if (!para) {
        para = document.createElement("p");
        pbody.appendChild(para);
      }
      const mine = tidy(S.spoken || "");
      S.spoken = "";
      const lineHTML = mine ? escH(mine) : sentence(A);
      lines.push(lineHTML);
      if (mine) {
        S.para = true;
        aline.innerHTML = `<span class="tw heard">${escH(mine)}</span>`;
      }
      para.insertAdjacentHTML("beforeend", `<span class="line">${lineHTML}</span> `);
      words += mine ? countWords(mine) : toks.length;
      if (i === ANSWERS.length - 1) qcard.hidden = true;
      if (narrow()) aline.innerHTML = "";
      $("#pcount").textContent = `${words} words · exactly as you said them`;
      watch("Her answer goes on the page exactly as she said it.");
      await say(c, A.s, 2400);
    }
    qcard.hidden = true;
    if (S.para) S.para = `<span class="wo">${lines.slice(0, -1).join(" ")} </span>${lines[lines.length - 1]}`;
    setSay("Three questions, three answers. A first paragraph nobody else could have.");
    guide(`Try “Write it for me”. Then ${TAP.toLowerCase()} “Skip ahead three weeks”.`);
    await ask(c, [{ id: "f", label: "Skip ahead three weeks", primary: true }]);
    go(6);
  }
  async function finale(c) {
    setRail(5);
    gtag.textContent = "Guide";
    setStamp("Three weeks later · For UT Austin");
    wall("tomato");
    watch("The same eleven days, laid out for UT Austin’s three asks. Bookae never wrote a word of it.");
    const dots2 = ["rasp", "moss", ...REST.map((r) => r[2])];
    const kept = S.thread ? '<span class="pill kept">Making room for someone else</span>' : "";
    await mount(c, `<div class="arr">
    <div class="arr-top"><span class="label">Your days</span><span class="shelf-dots">${dots2.map((col) => `<i class="c-${col}"></i>`).join("")}</span><span class="shelf-n">${dots2.length} days kept</span></div>
    <div class="pieces">
      <article class="piece sheetlike"><span class="label">1 · Essay, any topic</span><h3>Your first paragraph</h3><p>${S.para || PARA}</p><span class="src">Every sentence said by you</span></article>
      <article class="piece sheetlike"><span class="label">2 · Short answer</span><h3>Why this major?</h3><p class="pills"><span class="pill">“how you learn from a small sample”</span><span class="pill">“the paths people make themselves”</span><span class="pill">“geography and something about information”</span></p><span class="src">Not written. Your own lines, side by side.</span></article>
      <article class="piece sheetlike"><span class="label">3 · Short answer</span><h3>Most proud of?</h3><p>“We made one existing library table a little easier to use. That’s what happened.”</p><p class="pills">${kept}<span class="pill">47 help visits</span><span class="pill n2">31 guide cards</span></p><span class="src">Your words and your counts</span></article>
    </div></div>`, "arr");
    $$(".piece", scene).forEach((el, i) => setTimeout(() => el.classList.add("in"), 400 + i * 900));
    await say(c, "Eleven ordinary days, arranged three ways for UT Austin.", 4600);
    setSay("A small movement. A story only you could tell.");
    guide(`Look as long as you like. Then ${TAP.toLowerCase()} “Finish the story”.`);
    await ask(c, [{ id: "e", label: "Finish the story", primary: true }]);
    await mount(c, `<div class="end"><div class="endcard" id="endcard">
      <p class="label">What you just used</p>
      <ul>
        <li><b>Voice journal</b>A day, kept by talking. The ums come out; her words stay.</li>
        <li><b>Connect the dots</b>Think Obsidian’s graph view, for her own days. Bookae suggests the thread; she decides if it’s true.</li>
        <li><b>School fit</b>A list that starts from her questions, with what each college asks for.</li>
        <li><b>Essay room</b>Bookae asks, she answers out loud, and her answers are the page.</li>
      </ul>
      <p class="fine">Elena is made up. Bookae is live at bookae.ai as a free, invite-only pilot.</p>
    </div></div>`, "end");
    wall("bookae");
    setStamp("You’re a reviewer again");
    setSay("That was Bookae.");
    setMore('<p class="vow">Bookae <span class="mk">never</span> writes for you.</p>');
    actEl.innerHTML = `<div class="ctas"><a class="btn primary" href="${LINKS.workspace}" target="_blank" rel="noopener">Open the live workspace</a><a class="btn" href="${LINKS.films}" target="_blank" rel="noopener">Watch the films</a><button type="button" class="btn quiet" id="again">Play again</button></div>`;
    $("#again").addEventListener("click", () => go(0));
    watch("Here’s what you just used, and where to see more.");
  }
  const SCENES = [land, welcome, days, dots, fit, room, finale];
  async function go(i, first) {
    S.i = i;
    S.next = null;
    S.relayout = null;
    if (S.listener) {
      S.listener.stop();
      S.listener = null;
    }
    floatClose();
    if (i !== 1) closeLanding(true);
    S.onJump = null;
    if (S.stopField && i !== 1) {
      S.stopField();
      S.stopField = null;
    }
    if (i > 1) document.body.dataset.mode = "play";
    timerEl.style.transition = "none";
    timerEl.style.width = "0";
    $$(".trav").forEach((t) => t.remove());
    const c = ctx();
    clearAct();
    setMore("");
    try {
      await SCENES[i](c, first);
    } catch (e) {
      if (!(e instanceof Abort)) throw e;
    }
  }
  rail.addEventListener("click", (e) => {
    const b = e.target.closest("[data-go]");
    if (b) go(+b.dataset.go);
  });
  skipBtn.addEventListener("click", () => go(Math.min(S.i + 1, 6)));
  actEl.addEventListener("click", (e) => {
    if (e.target.closest("[data-next]")) S.next?.();
  });
  addEventListener("keydown", (e) => {
    if (S.floatKey && (e.key === "Enter" || e.key === "Escape")) {
      e.preventDefault();
      S.floatKey(e);
      return;
    }
    if (e.target.closest?.("button,a") || !["Enter", " ", "ArrowRight"].includes(e.key)) return;
    const p = $(".btn.primary, .cta", document.body.dataset.mode === "land" ? scene : actEl) || $("#become");
    if (S.next) {
      e.preventDefault();
      S.next();
    } else if (p && p.tagName === "BUTTON") {
      e.preventDefault();
      p.click();
    }
  });
  new ResizeObserver(() => S.relayout?.()).observe(scene);
  go(0, true);
})();
</script>
